          <div class="card-grid">${albumRowHTML}</div>
        </div>` : ''}
        ${artists.length ? `
        <div class="section">
          <div class="section-header"><div class="section-title">Your artists</div><div class="section-show-all" data-show="artists">Show all</div></div>
          <div class="card-grid">${artistRowHTML}</div>
        </div>` : ''}
      </div>
    `;
    this._wireQuickCards();
    this._wireCards();
  },

  _cardRow(items) {
    return items.map(it => {
      const bgStyle = it.art ? GradientGen.bgStyleFor(it.art) : `background:${GradientGen.forSeed(it.title)};`;
      return `
        <div class="card" data-type="${it.type}" data-id="${escapeAttr(it.id)}">
          <div class="card-art-wrap">
            <div class="card-art ${it.round ? 'round' : ''}" style="${bgStyle}"></div>
            <button class="card-play-btn" data-play-card>
              <svg viewBox="0 0 16 16" fill="currentColor"><path d="M3 1.713a.7.7 0 011.05-.607l10.89 6.288a.7.7 0 010 1.212L4.05 14.894A.7.7 0 013 14.288V1.713z"/></svg>
            </button>
          </div>
          <div class="card-title">${escapeHtml(it.title)}</div>
          <div class="card-subtitle">${escapeHtml(it.subtitle)}</div>
        </div>
      `;
    }).join('');
  },

  _wireQuickCards() {
    this.viewRoot.querySelectorAll('.quick-card').forEach(el => {
      el.addEventListener('click', (e) => {
        if (e.target.closest('.quick-card-play')) return;
        const route = el.dataset.route;
        if (route === 'liked') Router.navigate('liked');
        else if (route === 'playlist') Router.navigate('playlist', { playlistId: el.dataset.id });
        else if (route === 'track') {
          const id = el.dataset.id; const t = Library.getTrack(id);
          if (t) Player.playTrack(t, [t], 0);
        }
      });
    });
    this.viewRoot.querySelectorAll('.quick-card-play').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (btn.dataset.play) {
          const t = Library.getTrack(btn.dataset.play); if (t) Player.playTrack(t, [t], 0);
        } else if (btn.dataset.pl) {
          const p = Library.playlists.find(p => p.id === btn.dataset.pl);
          if (p) {
            const tracks = p.trackIds.map(id => Library.getTrack(id)).filter(Boolean);
            if (tracks.length) Player.playTrack(tracks[0], tracks, 0);
          }
        } else if (btn.dataset.liked) {
          const tracks = [...Library.liked].map(id => Library.getTrack(id)).filter(Boolean);
          if (tracks.length) Player.playTrack(tracks[0], tracks, 0);
        }
      });
    });
  },

  _wireCards() {
    this.viewRoot.querySelectorAll('.card').forEach(el => {
      el.addEventListener('click', (e) => {
        if (e.target.closest('[data-play-card]')) return;
        const type = el.dataset.type, id = el.dataset.id;
        if (type === 'track') { const t = Library.getTrack(id); if (t) Router.navigate('album', { albumKey: `${t.album}__${t.artist}` }); }
        else if (type === 'album') Router.navigate('album', { albumKey: id });
        else if (type === 'artist') Router.navigate('artist', { artistName: id });
      });
      const playBtn = el.querySelector('[data-play-card]');
      if (playBtn) {
        playBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          const type = el.dataset.type, id = el.dataset.id;
          if (type === 'track') { const t = Library.getTrack(id); if (t) Player.playTrack(t, [t], 0); }
          else if (type === 'album') {
            const [album, artist] = id.split('__');
            const tracks = Library.tracks.filter(t => t.album === album && t.artist === artist);
            if (tracks.length) Player.playTrack(tracks[0], tracks, 0);
          } else if (type === 'artist') {
            const tracks = Library.tracks.filter(t => t.artist === id);
            if (tracks.length) Player.playTrack(tracks[0], tracks, 0);
          }
        });
      }
    });
  },

  _renderSearch() {
    const genres = ['Rock','Pop','Hip-Hop','Jazz','Classical','Electronic','Indie','Metal','Folk','Country','R&B','Latin','Soul','Punk','Reggae','Blues'];
    const colors = ['#e8115b','#dc148c','#7358ff','#0d73ec','#1e3264','#27856a','#1db954','#777777','#8d67ab','#477d95','#d84000','#e91429','#bc5900','#f037a5','#148a08','#ba5d07'];
    const html = genres.map((g, i) => `
      <div class="genre-card" data-genre="${escapeAttr(g)}" style="background:${colors[i % colors.length]};">
        <div class="genre-card-title">${escapeHtml(g)}</div>
      </div>
    `).join('');
    this.viewRoot.innerHTML = `
      <div class="content-inner">
        <div id="search-results"></div>
        <div id="genres-section">
          <h2 style="font-size:24px; font-weight:700; margin: 16px 0;">Browse all</h2>
          <div class="genres-grid">${html}</div>
        </div>
      </div>
    `;
    const input = document.getElementById('search-input');
    input.value = '';
    input.focus();
    input.oninput = () => this._runSearch(input.value.trim());
    this.viewRoot.querySelectorAll('.genre-card').forEach(c => {
      c.addEventListener('click', () => { input.value = c.dataset.genre; this._runSearch(c.dataset.genre); });
    });
  },

  _runSearch(q) {
    const results = document.getElementById('search-results');
    const genres = document.getElementById('genres-section');
    if (!q) { results.innerHTML = ''; genres.style.display = ''; return; }
    genres.style.display = 'none';
    const ql = q.toLowerCase();
    const tracks = Library.tracks.filter(t =>
      t.title.toLowerCase().includes(ql) ||
      t.artist.toLowerCase().includes(ql) ||
      t.album.toLowerCase().includes(ql)
    ).slice(0, 50);
    const albums = Library.groupByAlbum().filter(a => a.album.toLowerCase().includes(ql) || a.artist.toLowerCase().includes(ql)).slice(0, 12);
    const artists = Library.groupByArtist().filter(a => a.artist.toLowerCase().includes(ql)).slice(0, 12);
    const playlists = Library.playlists.filter(p => p.name.toLowerCase().includes(ql)).slice(0, 12);

    let html = '';
    if (tracks.length) {
      html += `<div class="section"><div class="section-header"><div class="section-title">Songs</div></div>`;
      html += this._renderInlineTracklist(tracks.slice(0, 10), tracks);
      html += `</div>`;
    }
    if (albums.length) {
      html += `<div class="section"><div class="section-header"><div class="section-title">Albums</div></div>`;
      html += `<div class="card-grid">${this._cardRow(albums.map(a => ({ type: 'album', id: `${a.album}__${a.artist}`, title: a.album, subtitle: a.artist, art: a.tracks[0] })))}</div>`;
      html += `</div>`;
    }
    if (artists.length) {
      html += `<div class="section"><div class="section-header"><div class="section-title">Artists</div></div>`;
      html += `<div class="card-grid">${this._cardRow(artists.map(a => ({ type: 'artist', id: a.artist, title: a.artist, subtitle: 'Artist', art: a.tracks[0], round: true })))}</div>`;
      html += `</div>`;
    }
    if (playlists.length) {
      html += `<div class="section"><div class="section-header"><div class="section-title">Playlists</div></div>`;
      html += `<div class="card-grid">`;
      html += playlists.map(p => {
        const ft = p.trackIds.map(id => Library.getTrack(id)).find(Boolean);
        const bg = ft ? GradientGen.bgStyleFor(ft) : `background:${GradientGen.forSeed(p.name)};`;
        return `
          <div class="card" data-type="playlist" data-id="${escapeAttr(p.id)}">
            <div class="card-art-wrap"><div class="card-art" style="${bg}"></div>
            <button class="card-play-btn" data-play-card><svg viewBox="0 0 16 16" fill="currentColor"><path d="M3 1.713a.7.7 0 011.05-.607l10.89 6.288a.7.7 0 010 1.212L4.05 14.894A.7.7 0 013 14.288V1.713z"/></svg></button></div>
            <div class="card-title">${escapeHtml(p.name)}</div>
            <div class="card-subtitle">By you • ${p.trackIds.length} song${p.trackIds.length === 1 ? '' : 's'}</div>
          </div>`;
      }).join('');
      html += `</div></div>`;
    }
    if (!html) html = `<div class="empty-state"><h3>No results found for "${escapeHtml(q)}"</h3><div>Try different keywords or check your spelling.</div></div>`;
    results.innerHTML = html;
    this._wireCards();
    this._wireTrackRows(results);
    // Wire playlist cards
    results.querySelectorAll('.card[data-type="playlist"]').forEach(el => {
      el.addEventListener('click', (e) => {
        if (e.target.closest('[data-play-card]')) return;
        Router.navigate('playlist', { playlistId: el.dataset.id });
      });
      const pb = el.querySelector('[data-play-card]');
      if (pb) pb.addEventListener('click', (e) => {
        e.stopPropagation();
        const p = Library.playlists.find(p => p.id === el.dataset.id);
        if (p) {
          const ts = p.trackIds.map(id => Library.getTrack(id)).filter(Boolean);
          if (ts.length) Player.playTrack(ts[0], ts, 0);
        }
      });
    });
  },

  _renderLibrary() {
    const tab = Router.current.tab || 'all';
    const counts = {
      all: Library.tracks.length,
      playlists: Library.playlists.length,
      albums: Library.groupByAlbum().length,
      artists: Library.groupByArtist().length,
    };
    const tabsHTML = `
      <div class="library-tabs">
        <button class="library-tab ${tab==='all'?'active':''}" data-tab="all">Tracks (${counts.all})</button>
        <button class="library-tab ${tab==='playlists'?'active':''}" data-tab="playlists">Playlists (${counts.playlists})</button>
        <button class="library-tab ${tab==='albums'?'active':''}" data-tab="albums">Albums (${counts.albums})</button>
        <button class="library-tab ${tab==='artists'?'active':''}" data-tab="artists">Artists (${counts.artists})</button>
      </div>
    `;
    let bodyHTML = '';
    if (tab === 'all') {
      const sortBy = Router.current.sortBy || 'addedAt';
      const sortDir = Router.current.sortDir || 'desc';
      const sorted = Library.tracks.slice().sort((a, b) => {
        let av = a[sortBy], bv = b[sortBy];
        if (typeof av === 'string') return sortDir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
        return sortDir === 'asc' ? (av || 0) - (bv || 0) : (bv || 0) - (av || 0);
      });
      bodyHTML = `<div style="margin-top:16px;">${this._renderInlineTracklist(sorted, sorted, true)}</div>`;
    } else if (tab === 'playlists') {
      const items = [{ type: 'liked-card' }, ...Library.playlists.map(p => ({ type: 'playlist', p }))];
      bodyHTML = `<div class="card-grid">${items.map(it => {
        if (it.type === 'liked-card') {
          return `<div class="card" data-route="liked">
            <div class="card-art-wrap"><div class="card-art" style="background:var(--liked-gradient); display:flex; align-items:center; justify-content:center;">
              <svg viewBox="0 0 16 16" width="48" height="48" fill="#fff"><path d="M15.724 4.22A4.313 4.313 0 0012.192.814a4.269 4.269 0 00-3.622 1.13.837.837 0 01-1.14 0 4.272 4.272 0 00-6.21 5.855l5.916 7.05a1.128 1.128 0 001.727 0l5.916-7.05a4.228 4.228 0 00.945-3.577z"/></svg>
            </div></div>
            <div class="card-title">Liked Songs</div>
            <div class="card-subtitle">${Library.liked.size} song${Library.liked.size === 1 ? '' : 's'}</div>
          </div>`;
        }
        const ft = it.p.trackIds.map(id => Library.getTrack(id)).find(Boolean);
        const bg = ft ? GradientGen.bgStyleFor(ft) : `background:${GradientGen.forSeed(it.p.name)};`;
        return `<div class="card" data-route="playlist" data-id="${escapeAttr(it.p.id)}">
          <div class="card-art-wrap"><div class="card-art" style="${bg}"></div></div>
          <div class="card-title">${escapeHtml(it.p.name)}</div>
          <div class="card-subtitle">${it.p.trackIds.length} song${it.p.trackIds.length === 1 ? '' : 's'}</div>
        </div>`;
      }).join('')}</div>`;
    } else if (tab === 'albums') {
      const albums = Library.groupByAlbum().sort((a, b) => a.album.localeCompare(b.album));
      bodyHTML = `<div class="card-grid">${this._cardRow(albums.map(a => ({ type: 'album', id: `${a.album}__${a.artist}`, title: a.album, subtitle: a.artist, art: a.tracks[0] })))}</div>`;
    } else if (tab === 'artists') {
      const artists = Library.groupByArtist().sort((a, b) => a.artist.localeCompare(b.artist));
      bodyHTML = `<div class="card-grid">${this._cardRow(artists.map(a => ({ type: 'artist', id: a.artist, title: a.artist, subtitle: 'Artist', art: a.tracks[0], round: true })))}</div>`;
    }
    this.viewRoot.innerHTML = `<div class="content-inner"><h1 class="greeting">Your Library</h1>${tabsHTML}${bodyHTML}</div>`;
    this.viewRoot.querySelectorAll('.library-tab').forEach(b => {
      b.addEventListener('click', () => Router.navigate('library', { tab: b.dataset.tab }));
    });
    this._wireCards();
    this.viewRoot.querySelectorAll('[data-route="liked"]').forEach(el => el.addEventListener('click', () => Router.navigate('liked')));
    this.viewRoot.querySelectorAll('[data-route="playlist"]').forEach(el => el.addEventListener('click', () => Router.navigate('playlist', { playlistId: el.dataset.id })));
    if (tab === 'all') {
      this._wireTrackRows(this.viewRoot);
      this.viewRoot.querySelectorAll('.tracklist-header > div[data-sort]').forEach(h => {
        h.addEventListener('click', () => {
          const cur = Router.current;
          const dir = cur.sortBy === h.dataset.sort && cur.sortDir === 'asc' ? 'desc' : 'asc';
          Router.navigate('library', { tab: 'all', sortBy: h.dataset.sort, sortDir: dir });
        });
      });
    }
  },

  _renderPlaylist(id) {
    const p = Library.playlists.find(p => p.id === id);
    if (!p) { Router.navigate('home'); return; }
    const tracks = p.trackIds.map(id => Library.getTrack(id)).filter(Boolean);
    const totalDur = tracks.reduce((s, t) => s + (t.duration || 0), 0);
    const firstTrack = tracks[0];
    const bg = firstTrack ? GradientGen.bgStyleFor(firstTrack) : `background:${GradientGen.forSeed(p.name)};`;
    const detailBg = avgColorFromGradient(p.name);
    this.viewRoot.innerHTML = `
      <div class="detail-header" style="--detail-bg:${detailBg}">
        <div class="detail-art" style="${bg}"></div>
        <div class="detail-info">
          <div class="detail-type">Playlist</div>
          <input class="detail-title ${p.name.length > 16 ? p.name.length > 32 ? 'smaller' : 'small' : ''}" id="playlist-title-input" value="${escapeAttr(p.name)}" />
          <div class="detail-meta">
            <strong>You</strong><span class="detail-meta-divider">•</span>
            <span class="detail-meta-light">${tracks.length} song${tracks.length === 1 ? '' : 's'}, ${formatDurationLong(totalDur)}</span>
          </div>
        </div>
      </div>
      <div class="detail-actions">
        <button class="play-big" id="pl-play"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M3 1.713a.7.7 0 011.05-.607l10.89 6.288a.7.7 0 010 1.212L4.05 14.894A.7.7 0 013 14.288V1.713z"/></svg></button>
        <button class="icon-btn small" id="pl-shuffle" title="Shuffle">
          <svg viewBox="0 0 16 16" fill="currentColor"><path d="M13.151.922a.75.75 0 10-1.06 1.06L13.109 3H11.16a3.75 3.75 0 00-2.873 1.34l-6.173 7.356A2.25 2.25 0 01.39 12.5H0V14h.391a3.75 3.75 0 002.873-1.34l6.173-7.356a2.25 2.25 0 011.724-.804h1.947l-1.017 1.018a.75.75 0 001.06 1.06L15.98 3.75 13.15.922zM.391 3.5H0V2h.391c1.109 0 2.16.49 2.873 1.34L4.89 5.277l-.979 1.167-1.796-2.14A2.25 2.25 0 00.39 3.5z"/><path d="M7.5 10.723l.98-1.167.957 1.14a2.25 2.25 0 001.724.804h1.947l-1.017-1.018a.75.75 0 111.06-1.06l2.829 2.828-2.829 2.828a.75.75 0 11-1.06-1.06L13.109 13H11.16a3.75 3.75 0 01-2.873-1.34l-.787-.938z"/></svg>
        </button>
        <button class="icon-btn small" id="pl-more" title="More">
          <svg viewBox="0 0 16 16" fill="currentColor"><path d="M3 8a1.5 1.5 0 11-3 0 1.5 1.5 0 013 0zm6.5 0a1.5 1.5 0 11-3 0 1.5 1.5 0 013 0zM14.5 9.5a1.5 1.5 0 100-3 1.5 1.5 0 000 3z"/></svg>
        </button>
      </div>
      ${tracks.length ? `<div style="padding: 0 32px 32px;">${this._renderInlineTracklist(tracks, tracks, false, p.id)}</div>` : `<div class="empty-state"><h3>This playlist is empty</h3><div>Drag tracks here or use the right-click menu to add songs.</div></div>`}
    `;
    document.getElementById('playlist-title-input').addEventListener('change', (e) => {
      const newName = e.target.value.trim() || p.name;
      Library.renamePlaylist(p.id, newName);
      UI.refreshSidebar();
    });
    document.getElementById('pl-play').onclick = () => { if (tracks.length) Player.playTrack(tracks[0], tracks, 0); };
    document.getElementById('pl-shuffle').onclick = () => { if (tracks.length) { if (!Player.shuffle) Player.toggleShuffle(); Player.playTrack(tracks[0], tracks, 0); } };
    document.getElementById('pl-more').onclick = (e) => {
      e.stopPropagation();
      const r = e.currentTarget.getBoundingClientRect();
      ContextMenu.open(r.left, r.bottom + 8, [
        { label: 'Rename', action: 'rename', onClick: () => { Modal.show({ title: 'Rename playlist', defaultValue: p.name, onConfirm: name => { if (name) { Library.renamePlaylist(p.id, name); UI.refreshSidebar(); UI.render(); } } }); } },
        { label: 'Delete playlist', action: 'delete', onClick: () => { Modal.confirm({ title: 'Delete playlist?', message: `"${p.name}" will be removed.`, confirmText: 'Delete', onConfirm: () => { Library.deletePlaylist(p.id); UI.refreshSidebar(); Router.navigate('home'); } }); } },
      ]);
    };
    this._wireTrackRows(this.viewRoot, p.id);
  },

  _renderLiked() {
    const tracks = [...Library.liked].map(id => Library.getTrack(id)).filter(Boolean);
    const totalDur = tracks.reduce((s, t) => s + (t.duration || 0), 0);
    this.viewRoot.innerHTML = `
      <div class="detail-header" style="--detail-bg:#502388">
        <div class="detail-art liked"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M15.724 4.22A4.313 4.313 0 0012.192.814a4.269 4.269 0 00-3.622 1.13.837.837 0 01-1.14 0 4.272 4.272 0 00-6.21 5.855l5.916 7.05a1.128 1.128 0 001.727 0l5.916-7.05a4.228 4.228 0 00.945-3.577z"/></svg></div>
        <div class="detail-info">
          <div class="detail-type">Playlist</div>
          <div class="detail-title">Liked Songs</div>
          <div class="detail-meta"><strong>You</strong><span class="detail-meta-divider">•</span><span class="detail-meta-light">${tracks.length} song${tracks.length === 1 ? '' : 's'}, ${formatDurationLong(totalDur)}</span></div>
        </div>
      </div>
      <div class="detail-actions">
        <button class="play-big" id="liked-play"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M3 1.713a.7.7 0 011.05-.607l10.89 6.288a.7.7 0 010 1.212L4.05 14.894A.7.7 0 013 14.288V1.713z"/></svg></button>
      </div>
      ${tracks.length ? `<div style="padding: 0 32px 32px;">${this._renderInlineTracklist(tracks, tracks, false)}</div>` : `<div class="empty-state"><h3>Songs you like will appear here</h3><div>Save songs by tapping the heart icon.</div></div>`}
    `;
    document.getElementById('liked-play').onclick = () => { if (tracks.length) Player.playTrack(tracks[0], tracks, 0); };
    this._wireTrackRows(this.viewRoot);
  },

  _renderAlbum(key) {
    const [album, artist] = key.split('__');
    const tracks = Library.tracks.filter(t => t.album === album && t.artist === artist).sort((a, b) => (a.track || 0) - (b.track || 0));
    if (!tracks.length) { Router.navigate('home'); return; }
    const totalDur = tracks.reduce((s, t) => s + (t.duration || 0), 0);
    const ft = tracks[0];
    const bg = GradientGen.bgStyleFor(ft);
    const detailBg = avgColorFromGradient(album + artist);
    this.viewRoot.innerHTML = `
      <div class="detail-header" style="--detail-bg:${detailBg}">
        <div class="detail-art" style="${bg}"></div>
        <div class="detail-info">
          <div class="detail-type">Album</div>
          <div class="detail-title ${album.length > 16 ? album.length > 32 ? 'smaller' : 'small' : ''}">${escapeHtml(album)}</div>
          <div class="detail-meta">
            <strong style="cursor:pointer;" data-artist="${escapeAttr(artist)}">${escapeHtml(artist)}</strong>
            ${ft.year ? `<span class="detail-meta-divider">•</span><span>${escapeHtml(ft.year)}</span>` : ''}
            <span class="detail-meta-divider">•</span><span class="detail-meta-light">${tracks.length} song${tracks.length === 1 ? '' : 's'}, ${formatDurationLong(totalDur)}</span>
          </div>
        </div>
      </div>
      <div class="detail-actions">
        <button class="play-big" id="alb-play"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M3 1.713a.7.7 0 011.05-.607l10.89 6.288a.7.7 0 010 1.212L4.05 14.894A.7.7 0 013 14.288V1.713z"/></svg></button>
      </div>
      <div style="padding: 0 32px 32px;">${this._renderInlineTracklist(tracks, tracks, false)}</div>
    `;
    document.getElementById('alb-play').onclick = () => Player.playTrack(tracks[0], tracks, 0);
    this.viewRoot.querySelector('[data-artist]')?.addEventListener('click', () => Router.navigate('artist', { artistName: artist }));
    this._wireTrackRows(this.viewRoot);
  },

  _renderArtist(name) {
    const tracks = Library.tracks.filter(t => t.artist === name);
    if (!tracks.length) { Router.navigate('home'); return; }
    const albums = {};
    tracks.forEach(t => { if (!albums[t.album]) albums[t.album] = []; albums[t.album].push(t); });
    const ft = tracks[0];
    const bg = GradientGen.bgStyleFor(ft);
    const detailBg = avgColorFromGradient(name);
    const popular = tracks.slice(0, 5);
    const albumsHTML = Object.entries(albums).map(([album, ts]) => {
      const at = ts[0];
      const abg = GradientGen.bgStyleFor(at);
      return `<div class="card" data-type="album" data-id="${escapeAttr(album + '__' + name)}">
        <div class="card-art-wrap"><div class="card-art" style="${abg}"></div>
        <button class="card-play-btn" data-play-card><svg viewBox="0 0 16 16" fill="currentColor"><path d="M3 1.713a.7.7 0 011.05-.607l10.89 6.288a.7.7 0 010 1.212L4.05 14.894A.7.7 0 013 14.288V1.713z"/></svg></button></div>
        <div class="card-title">${escapeHtml(album)}</div>
        <div class="card-subtitle">${at.year || 'Album'}</div>
      </div>`;
    }).join('');
    this.viewRoot.innerHTML = `
      <div class="detail-header" style="--detail-bg:${detailBg}; padding-bottom:48px;">
        <div class="detail-art" style="${bg}; border-radius:50%;"></div>
        <div class="detail-info">
          <div class="detail-type">Artist</div>
          <div class="detail-title ${name.length > 16 ? name.length > 32 ? 'smaller' : 'small' : ''}">${escapeHtml(name)}</div>
          <div class="detail-meta detail-meta-light">${tracks.length} song${tracks.length === 1 ? '' : 's'}</div>
        </div>
      </div>
      <div class="detail-actions">
        <button class="play-big" id="art-play"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M3 1.713a.7.7 0 011.05-.607l10.89 6.288a.7.7 0 010 1.212L4.05 14.894A.7.7 0 013 14.288V1.713z"/></svg></button>
      </div>
      <div class="content-inner">
        <h2 style="font-size:24px; font-weight:700; margin-bottom:16px;">Popular</h2>
        ${this._renderInlineTracklist(popular, tracks, false, null, true)}
        ${Object.keys(albums).length ? `<h2 style="font-size:24px; font-weight:700; margin: 32px 0 16px;">Albums</h2><div class="card-grid">${albumsHTML}</div>` : ''}
      </div>
    `;
    document.getElementById('art-play').onclick = () => Player.playTrack(tracks[0], tracks, 0);
    this._wireCards();
    this._wireTrackRows(this.viewRoot);
  },

  _renderInlineTracklist(displayTracks, queueTracks, showSort = false, playlistId = null, hideHeader = false) {
    const cur = Router.current;
    const sortBy = cur.sortBy || 'addedAt';
    const sortDir = cur.sortDir || 'desc';
    const arrow = sortDir === 'asc' ? ' ↑' : ' ↓';
    const headerHTML = hideHeader ? '' : `
      <div class="tracklist-header">
        <div class="right">#</div>
        <div ${showSort ? 'data-sort="title"' : ''}>Title${showSort && sortBy === 'title' ? arrow : ''}</div>
        <div ${showSort ? 'data-sort="album"' : ''}>Album${showSort && sortBy === 'album' ? arrow : ''}</div>
        <div ${showSort ? 'data-sort="addedAt"' : ''}>Date added${showSort && sortBy === 'addedAt' ? arrow : ''}</div>
        <div class="right">
          <svg class="duration-icon" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1.5a6.5 6.5 0 100 13 6.5 6.5 0 000-13zM0 8a8 8 0 1116 0A8 8 0 010 8z"/><path d="M8 3.25a.75.75 0 01.75.75v3.25H11a.75.75 0 010 1.5H7.25V4A.75.75 0 018 3.25z"/></svg>
        </div>
      </div>`;
    const rowsHTML = displayTracks.map((t, idx) => this._renderTrackRow(t, idx, queueTracks, playlistId)).join('');
    return `<div class="tracklist-rows-wrap">${headerHTML}<div class="tracklist-rows">${rowsHTML}</div></div>`;
  },

  _renderTrackRow(t, idx, queueTracks, playlistId) {
    const isCur = Player.current()?.id === t.id;
    const liked = Library.isLiked(t.id);
    const dateStr = new Date(t.addedAt).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
    return `
      <div class="track-row ${isCur ? 'playing' : ''} ${isCur && !Player.isPlaying ? 'paused' : ''}" data-id="${escapeAttr(t.id)}" data-idx="${idx}" data-pl="${escapeAttr(playlistId || '')}" draggable="true">
        <div class="track-index">
          <span class="index-num">${idx + 1}</span>
          <span class="index-bars"><span></span><span></span><span></span></span>
          <button class="index-play" title="Play"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M3 1.713a.7.7 0 011.05-.607l10.89 6.288a.7.7 0 010 1.212L4.05 14.894A.7.7 0 013 14.288V1.713z"/></svg></button>
        </div>
        <div class="track-title-cell">
          <div class="track-art" style="${GradientGen.bgStyleFor(t)}"></div>
          <div class="track-title-info">
            <div class="track-title-name" title="${escapeAttr(t.title)}">${escapeHtml(t.title)}</div>
            <div class="track-title-artist" title="${escapeAttr(t.artist)}">${escapeHtml(t.artist)}</div>
          </div>
        </div>
        <div class="track-cell-ellipsis" title="${escapeAttr(t.album)}">${escapeHtml(t.album)}</div>
        <div class="track-cell-ellipsis">${dateStr}</div>
        <div class="track-duration-cell">
          <button class="track-like ${liked ? 'liked' : ''}" data-like>
            <svg viewBox="0 0 16 16" fill="currentColor">${liked
              ? '<path d="M15.724 4.22A4.313 4.313 0 0012.192.814a4.269 4.269 0 00-3.622 1.13.837.837 0 01-1.14 0 4.272 4.272 0 00-6.21 5.855l5.916 7.05a1.128 1.128 0 001.727 0l5.916-7.05a4.228 4.228 0 00.945-3.577z"/>'
              : '<path d="M1.69 2A4.582 4.582 0 018 2.023 4.583 4.583 0 0111.88.817h.002a4.618 4.618 0 013.782 3.65v.003a4.543 4.543 0 01-1.011 3.84L9.35 14.629a1.765 1.765 0 01-2.093.464 1.762 1.762 0 01-.605-.463L1.348 8.309A4.582 4.582 0 011.689 2zm3.158.252A3.082 3.082 0 002.49 7.337l.005.005L7.8 13.664a.264.264 0 00.311.069.262.262 0 00.09-.069l5.312-6.33a3.043 3.043 0 00.68-2.573 3.118 3.118 0 00-2.551-2.463 3.079 3.079 0 00-2.612.816l-.007.007a1.501 1.501 0 01-2.045 0l-.009-.008a3.082 3.082 0 00-2.121-.861z"/>'
            }</svg>
          </button>
          <span>${formatTime(t.duration)}</span>
          <button class="track-more" data-more>
            <svg viewBox="0 0 16 16" fill="currentColor"><path d="M3 8a1.5 1.5 0 11-3 0 1.5 1.5 0 013 0zm6.5 0a1.5 1.5 0 11-3 0 1.5 1.5 0 013 0zM14.5 9.5a1.5 1.5 0 100-3 1.5 1.5 0 000 3z"/></svg>
          </button>
        </div>
      </div>
    `;
  },

  _wireTrackRows(scope, playlistId = null) {
    scope.querySelectorAll('.track-row').forEach(row => {
      const id = row.dataset.id;
      const idx = parseInt(row.dataset.idx, 10);
      const t = Library.getTrack(id);
      if (!t) return;
      // Find the queue from siblings
      const allRows = [...row.parentElement.children];
      const queue = allRows.map(r => Library.getTrack(r.dataset.id)).filter(Boolean);

      row.addEventListener('dblclick', () => Player.playTrack(t, queue, idx));
      row.querySelector('.index-play')?.addEventListener('click', (e) => { e.stopPropagation(); Player.playTrack(t, queue, idx); });

      row.querySelector('[data-like]')?.addEventListener('click', (e) => { e.stopPropagation(); Library.toggleLike(id); UI.refreshSidebar(); UI.render(); UI.refreshNowPlaying(); });

      row.querySelector('[data-more]')?.addEventListener('click', (e) => { e.stopPropagation(); UI._openTrackContextMenu(e.clientX, e.clientY, t, playlistId || row.dataset.pl); });

      row.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        UI._openTrackContextMenu(e.clientX, e.clientY, t, playlistId || row.dataset.pl);
      });

      row.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData('text/track-id', id);
        e.dataTransfer.effectAllowed = 'copy';
        row.classList.add('dragging');
      });
      row.addEventListener('dragend', () => row.classList.remove('dragging'));

      row.addEventListener('click', (e) => {
        if (e.target.closest('button')) return;
        scope.querySelectorAll('.track-row.selected').forEach(r => r.classList.remove('selected'));
        row.classList.add('selected');
      });
    });
  },

  _openTrackContextMenu(x, y, track, playlistId) {
    const playlistsSubmenu = Library.playlists.map(p => ({
      label: p.name,
      action: 'add-to-' + p.id,
      onClick: () => {
        if (Library.addToPlaylist(p.id, track.id)) Toast.show(`Added to ${p.name}`);
        else Toast.show(`Already in ${p.name}`);
        UI.refreshSidebar();
      }
    }));
    playlistsSubmenu.unshift({ label: '+ New playlist', action: 'new-pl', onClick: () => {
      Modal.show({ title: 'Create playlist', placeholder: 'My Playlist', defaultValue: '', onConfirm: name => {
        if (!name) return;
        const p = Library.createPlaylist(name);
        Library.addToPlaylist(p.id, track.id);
        Toast.show(`Added to ${name}`);
        UI.refreshSidebar();
      }});
    }});
    const items = [
      { label: 'Add to queue', action: 'queue', onClick: () => { Player.addToQueueEnd(track); Toast.show('Added to queue'); } },
      { label: 'Play next', action: 'queue-next', onClick: () => { Player.addToQueueNext(track); Toast.show('Playing next'); } },
      { divider: true },
      { label: 'Go to artist', action: 'goartist', onClick: () => Router.navigate('artist', { artistName: track.artist }) },
      { label: 'Go to album', action: 'goalbum', onClick: () => Router.navigate('album', { albumKey: `${track.album}__${track.artist}` }) },
      { divider: true },
      { label: 'Add to playlist', submenu: playlistsSubmenu },
      { label: Library.isLiked(track.id) ? 'Remove from your Liked Songs' : 'Save to your Liked Songs', action: 'like', onClick: () => { Library.toggleLike(track.id); UI.refreshSidebar(); UI.render(); UI.refreshNowPlaying(); } },
    ];
    if (playlistId) {
      items.push({ divider: true });
      items.push({ label: 'Remove from this playlist', action: 'remove', onClick: () => { Library.removeFromPlaylist(playlistId, track.id); UI.render(); UI.refreshSidebar(); } });
    }
    ContextMenu.open(x, y, items);
  },

  refreshNowPlaying() {
    const t = Player.current();
    document.getElementById('np-title').textContent = t ? t.title : 'No track playing';
    document.getElementById('np-artist').textContent = t ? t.artist : '—';
    document.getElementById('np-art').style = t ? GradientGen.bgStyleFor(t) : '';
    const liked = t && Library.isLiked(t.id);
    const likeBtn = document.getElementById('np-like');
    likeBtn.classList.toggle('liked', !!liked);
    likeBtn.querySelector('svg').innerHTML = liked
      ? '<path d="M15.724 4.22A4.313 4.313 0 0012.192.814a4.269 4.269 0 00-3.622 1.13.837.837 0 01-1.14 0 4.272 4.272 0 00-6.21 5.855l5.916 7.05a1.128 1.128 0 001.727 0l5.916-7.05a4.228 4.228 0 00.945-3.577z"/>'
      : '<path d="M1.69 2A4.582 4.582 0 018 2.023 4.583 4.583 0 0111.88.817h.002a4.618 4.618 0 013.782 3.65v.003a4.543 4.543 0 01-1.011 3.84L9.35 14.629a1.765 1.765 0 01-2.093.464 1.762 1.762 0 01-.605-.463L1.348 8.309A4.582 4.582 0 011.689 2zm3.158.252A3.082 3.082 0 002.49 7.337l.005.005L7.8 13.664a.264.264 0 00.311.069.262.262 0 00.09-.069l5.312-6.33a3.043 3.043 0 00.68-2.573 3.118 3.118 0 00-2.551-2.463 3.079 3.079 0 00-2.612.816l-.007.007a1.501 1.501 0 01-2.045 0l-.009-.008a3.082 3.082 0 00-2.121-.861z"/>';
    this.updateControls();
    this.refreshTrackHighlight();
    this.refreshQueue();
    this.refreshExpanded();
  },

  refreshTrackHighlight() {
    const cur = Player.current();
    document.querySelectorAll('.track-row').forEach(row => {
      const isCur = cur && row.dataset.id === cur.id;
      row.classList.toggle('playing', isCur);
      row.classList.toggle('paused', isCur && !Player.isPlaying);
    });
  },

  updatePlayState(playing) {
    document.getElementById('icon-play').classList.toggle('hidden', playing);
    document.getElementById('icon-pause').classList.toggle('hidden', !playing);
    document.getElementById('btn-play').title = playing ? 'Pause' : 'Play';
    this.refreshTrackHighlight();
  },

  updateControls() {
    document.getElementById('btn-shuffle').classList.toggle('active', Player.shuffle);
    document.getElementById('btn-repeat').classList.toggle('active', Player.repeat !== 'off');
    const repeatBtn = document.getElementById('btn-repeat');
    repeatBtn.title = `Repeat: ${Player.repeat}`;
    if (Player.repeat === 'one') {
      repeatBtn.querySelector('svg').innerHTML = '<path d="M0 4.75A3.75 3.75 0 013.75 1h8.5A3.75 3.75 0 0116 4.75v5a3.75 3.75 0 01-3.75 3.75H9.81l1.018 1.018a.75.75 0 11-1.06 1.06L6.939 12.75l2.829-2.828a.75.75 0 011.06 1.06L9.811 12h2.439a2.25 2.25 0 002.25-2.25v-5a2.25 2.25 0 00-2.25-2.25h-8.5A2.25 2.25 0 001.5 4.75v5A2.25 2.25 0 003.75 12H5v1.5H3.75A3.75 3.75 0 010 9.75v-5z"/><path d="M9 6.5h-.5a.75.75 0 00-.75.75V11h1.25v-3.5h.75v-1z"/>';
    } else {
      repeatBtn.querySelector('svg').innerHTML = '<path d="M0 4.75A3.75 3.75 0 013.75 1h8.5A3.75 3.75 0 0116 4.75v5a3.75 3.75 0 01-3.75 3.75H9.81l1.018 1.018a.75.75 0 11-1.06 1.06L6.939 12.75l2.829-2.828a.75.75 0 011.06 1.06L9.811 12h2.439a2.25 2.25 0 002.25-2.25v-5a2.25 2.25 0 00-2.25-2.25h-8.5A2.25 2.25 0 001.5 4.75v5A2.25 2.25 0 003.75 12H5v1.5H3.75A3.75 3.75 0 010 9.75v-5z"/>';
    }
    this.updateVolume();
  },

  updateVolume() {
    const v = Player.muted ? 0 : Player.volume;
    document.getElementById('vol-fill').style.width = (v * 100) + '%';
    document.getElementById('vol-thumb').style.left = (v * 100) + '%';
    ['icon-vol-high','icon-vol-mid','icon-vol-low','icon-vol-mute'].forEach(id => document.getElementById(id).classList.add('hidden'));
    if (Player.muted || v === 0) document.getElementById('icon-vol-mute').classList.remove('hidden');
    else if (v < 0.33) document.getElementById('icon-vol-low').classList.remove('hidden');
    else if (v < 0.66) document.getElementById('icon-vol-mid').classList.remove('hidden');
    else document.getElementById('icon-vol-high').classList.remove('hidden');
  },

  updateProgress(cur, dur) {
    if (!this._seeking) {
      const pct = dur ? (cur / dur) * 100 : 0;
      document.getElementById('seek-fill').style.width = pct + '%';
      document.getElementById('seek-thumb').style.left = pct + '%';
    }
    document.getElementById('np-current').textContent = formatTime(cur);
    document.getElementById('np-duration').textContent = formatTime(dur);
  },

  refreshQueue() {
    const panel = document.getElementById('queue-panel');
    if (!panel.classList.contains('open')) return;
    const cur = Player.current();
    const next = Player.queue.slice(Player.index + 1);
    const html = `
      <h2>Queue</h2>
      ${cur ? `<div class="queue-section"><h3>Now playing</h3>
        <div class="queue-item current">
          <div class="track-art" style="${GradientGen.bgStyleFor(cur)}; width:40px;height:40px;"></div>
          <div style="min-width:0; flex:1;">
            <div class="queue-item-name truncate">${escapeHtml(cur.title)}</div>
            <div class="track-title-artist truncate">${escapeHtml(cur.artist)}</div>
          </div>
        </div></div>` : ''}
      ${next.length ? `<div class="queue-section"><h3>Next up</h3>${next.map((t, i) => `
        <div class="queue-item" data-q-idx="${Player.index + 1 + i}">
          <div class="track-art" style="${GradientGen.bgStyleFor(t)}; width:40px;height:40px;"></div>
          <div style="min-width:0; flex:1;">
            <div class="queue-item-name truncate">${escapeHtml(t.title)}</div>
            <div class="track-title-artist truncate">${escapeHtml(t.artist)}</div>
          </div>
        </div>`).join('')}</div>` : ''}
    `;
    panel.innerHTML = html;
    panel.querySelectorAll('[data-q-idx]').forEach(el => {
      el.addEventListener('click', () => { Player.index = parseInt(el.dataset.qIdx, 10); Player._loadAndPlay(); });
    });
  },

  toggleQueue() {
    const panel = document.getElementById('queue-panel');
    panel.classList.toggle('open');
    if (panel.classList.contains('open')) this.refreshQueue();
  },

  _closeQueue() {
    document.getElementById('queue-panel').classList.remove('open');
  },

  toggleExpanded() {
    const el = document.getElementById('expanded-np');
    el.classList.toggle('open');
    if (el.classList.contains('open')) this.refreshExpanded();
  },
  _closeExpanded() { document.getElementById('expanded-np').classList.remove('open'); },

      <div class="expanded-np-header">
        <button class="icon-btn" id="exp-close" title="Close">
          <svg viewBox="0 0 16 16" fill="currentColor"><path d="M14.5 6.55a.75.75 0 00-1.06 0L8 11.99 2.56 6.55a.75.75 0 10-1.06 1.06L8 14.11l6.5-6.5a.75.75 0 000-1.06z"/></svg>

  _setupSliders() {
    this._setupSlider('seek-slider', (pct) => {
      const dur = Player.audio.duration || 0;
      Player.seek(pct * dur);
    }, (pct) => {
      this._seeking = true;
      const dur = Player.audio.duration || 0;
      document.getElementById('seek-fill').style.width = (pct * 100) + '%';
      document.getElementById('seek-thumb').style.left = (pct * 100) + '%';
      document.getElementById('np-current').textContent = formatTime(pct * dur);
    }, () => { this._seeking = false; });
    this._setupSlider('vol-slider', (pct) => {
      Player.muted = false;
      Player.setVolume(pct);
    });
  },

  _setupSlider(id, onCommit, onMove, onRelease) {
    const el = document.getElementById(id);
    let dragging = false;
    const calc = (e) => {
      const r = el.getBoundingClientRect();
      const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
      return Math.max(0, Math.min(1, x / r.width));
    };
    el.addEventListener('mousedown', (e) => {
      dragging = true;
      el.classList.add('dragging');
      const pct = calc(e);
      if (onMove) onMove(pct); else onCommit(pct);
    });
    document.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      const pct = calc(e);
      if (onMove) onMove(pct);
    });
    document.addEventListener('mouseup', (e) => {
      if (!dragging) return;
      dragging = false;
      el.classList.remove('dragging');
      const pct = calc(e);
      onCommit(pct);
      if (onRelease) onRelease();
    });
  },

  _setupNavButtons() {
    document.getElementById('btn-back').onclick = () => Router.back();
    document.getElementById('btn-forward').onclick = () => Router.forward();

    document.getElementById('btn-pick-folder').onclick = () => Library.pickFolder();

      Modal.show({ title: 'Create new playlist', placeholder: 'My Playlist', defaultValue: 'My Playlist #' + (Library.playlists.length + 1), onConfirm: name => {

      } });

    document.getElementById('menu-about').onclick = () => Modal.show({ title: 'About Localfy', defaultValue: 'A pixel-perfect, fully local Spotify-style player for your music. v1.0', confirmText: 'OK', onConfirm: () => {} });

    // Playback controls
    document.getElementById('btn-play').onclick = () => Player.togglePlay();
    document.getElementById('btn-prev').onclick = () => Player.prev();
    document.getElementById('btn-next').onclick = () => Player.next();
    document.getElementById('btn-shuffle').onclick = () => Player.toggleShuffle();

    document.getElementById('btn-queue').onclick = () => UI.toggleQueue();

      const t = Player.current();
      if (t) Router.navigate('album', { albumKey: `${t.album}__${t.artist}` });
    };

      const t = Player.current();
      if (t) Router.navigate('artist', { artistName: t.artist });
    };
  },

  _setupKeyboard() {
    document.addEventListener('keydown', (e) => {
      const tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea') return;
      if (e.key === ' ') { e.preventDefault(); Player.togglePlay(); }
      else if (e.key === 'ArrowRight') { Player.seekRel(5); }
      else if (e.key === 'ArrowLeft') { Player.seekRel(-5); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); Player.setVolume(Math.min(1, Player.volume + 0.05)); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); Player.setVolume(Math.max(0, Player.volume - 0.05)); }
      else if (e.key === 'm' || e.key === 'M') { Player.toggleMute(); }
      else if (e.key === 'l' || e.key === 'L') {
        const t = Player.current();
        if (t) { Library.toggleLike(t.id); UI.refreshNowPlaying(); UI.refreshSidebar(); UI.refreshTrackHighlight(); Toast.show(Library.isLiked(t.id) ? 'Added to Liked Songs' : 'Removed from Liked Songs'); }
      }
      else if (e.key === 'n' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); Player.next(); }
      else if (e.key === 'p' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); Player.prev(); }
    });
  },
};

/* ============================================================
   === BOOTSTRAP ===
   ============================================================ */

const Library = new LibraryManager();
const Player = new PlayerEngine(document.getElementById('audio'));
const Router = new RouterClass();

function bootstrap() {
  Library.load();
  ContextMenu.init();
  UI.init();
  UI.refreshSidebar();
  UI.refreshNowPlaying();
  Router.navigate('home', {}, true);
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', bootstrap);
} else {
  bootstrap();
}
</script>
